name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The flake deliberately declares only x86_64-linux checks: each one builds a real nixidy
      # environment, so an ARM entry that this runner cannot realize would either be skipped or
      # turn a strict inventory check into a cross-build. --all-systems is still required: it
      # proves every system the flake actually claims instead of relying on the runner default.
      - name: nix flake check (all declared systems)
        run: nix flake check --all-systems --keep-going --print-build-logs
